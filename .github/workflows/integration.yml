name: Integration Tester

on:
  push:
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install websockets aiohttp bcrypt

      - name: Discover integration tests
        id: tests
        run: echo "tests=$(python -m tester.main --list --json)" >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: antongolub/action-setup-bun@v1
        with:
          bun-version: '1.2.4'

      - name: Build Frontend
        working-directory: ./web
        run: bun install && bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

  integration:
    needs: [discover, frontend]
    name: Integration (${{ matrix.test }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: antongolub/action-setup-bun@v1
        with:
          bun-version: '1.2.4'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Start Go server
        env:
          WEB_URL: localhost:8080
          ASSETS_URL: localhost:8080
          SAVE_DRIVE_RAM: 'true'
        run: |
          # Every matrix job has its own checkout, but remove ignored runtime
          # data explicitly so reruns cannot inherit a database or files.
          rm -rf uploaded_files
          go build -o ./angadrive-server .
          ./angadrive-server > server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          # Wait up to 30s for the server to come up.
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/; then
              echo "Server is up."
              break
            fi
            sleep 1
          done
          # Verify the server is actually listening before proceeding.
          if ! curl -s -o /dev/null http://localhost:8080/; then
            echo "Server failed to start."
            exit 1
          fi

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install websockets aiohttp bcrypt

      - name: Run ${{ matrix.test }}
        env:
          API_URL: localhost:8080
          TEST_TIMEOUT: '180'
        run: python -m tester.main --test "${{ matrix.test }}"

      - name: Stop Go server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" || true
          fi
          if [ -f server.log ]; then
            echo '--- Go server log ---'
            cat server.log
          fi